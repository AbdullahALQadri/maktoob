name: maktoob
description: "Maktoob"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.3.2
  file_picker: ^13.3.0

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.1.0

  # Dependency Injection
  get_it: ^9.3.0

  # Functional Programming
  dartz: ^0.10.1

  # Networking
  dio: ^5.11.1
  internet_connection_checker_plus: ^3.1.2

  # Local Storage
  shared_preferences: ^2.5.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0

  # Security
  safe_device: ^1.4.1

  # URL Launcher
  url_launcher: ^6.3.3

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Sharing
  share_plus: ^13.3.1

  # Maps (OpenStreetMap - no API key required)
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geocoding: ^5.0.1

  # Contacts
  flutter_contacts: ^2.6.0

  # Image Picker
  image_picker: ^1.2.4

  # AI Design Studio
  cached_network_image: ^4.0.6
  shimmer: ^4.0.0

  # Push Notifications (Firebase Cloud Messaging)
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

  # Excel Parsing
  excel: ^4.0.2

  # Path provider for file operations
  path_provider: ^2.1.6

  # OTP Input
  pinput: ^7.0.0
  wakelock_plus: ^1.8.2
  sqflite: ^2.4.5
  path: ^1.9.1
  crypto: ^3.0.8
  cryptography: ^2.9.0
  workmanager: ^0.10.10
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  integration_test:
    sdk: flutter
  cross_file: ^0.3.5+5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - lang/ar.json
    - lang/en.json
    - lang/tr.json

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
